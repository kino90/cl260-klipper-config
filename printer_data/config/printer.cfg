[include mainsail.cfg]

[virtual_sdcard]

path: /home/kino/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: P2.2
dir_pin: P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.29  # P1.28 for X-max
position_endstop: 0
position_max: 181
position_min: 0
homing_speed: 50

[stepper_y]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.27  # P1.26 for Y-max
position_endstop: 0
position_max: 213
position_min: 0
homing_speed: 50

[stepper_z]
step_pin: P0.22
dir_pin: !P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop #!P1.25
# position_endstop: 0.5
position_max: 200
position_min: -30 # TODO: remove

[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 22.70165
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: ATC Semitec 104NT-4-R025H42G #ATC Semitec 104GT-2
sensor_pin: P0.24
min_temp: 0
max_temp: 260
max_extrude_only_distance: 200
pressure_advance: 0.04
pressure_advance_smooth_time: 0.04

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.23
min_temp: 0
max_temp: 130

[fan]
pin: P2.3

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1768_2380000663A01DAF4F81035AC52000F5-if00

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2000
max_z_velocity: 25
max_z_accel: 100

# BLTouch and calibrations

[bltouch]
sensor_pin: ^P1.25  # Pull-up (^ symbol) needed in open drain mode
control_pin: P2.0 
x_offset: -40.5
y_offset: -1
samples: 2
speed: 2
#z_offset: 0

[safe_z_home]
home_xy_position: 125,125 # this should be the center of your bed
speed: 50 
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 10, 10   # !!min and max co-ords are based on the probes location not the nozzle!!
mesh_max: 140.5, 212 
probe_count: 5,5   # this is the number of probing points on X then Y axis
mesh_pps: 2,2
fade_start: 1
fade_end: 10
fade_target: 0


